<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/src/output.css" rel="stylesheet">
    <title>CinTrack</title>
</head>
<body class="bg-black text-white">
    <header class="fixed top-0 left-0 w-full flex items-center bg-gray-800 p-4 z-50 shadow-md">
        <div class="flex flex-wrap my-auto">
            <img src="/img/logo.png" alt="logo" class="h-10 w-10">
            <h1 class="text-3xl font-bold hidden sm:block">CinTrack</h1>
        </div>
        <div class="mx-auto w-auto">
            <label for="search"></label>
            <input id="search" type="text" class="bg-gray-500 border border-gray-400 text-center rounded-full w-full p-2 my-2.5" placeholder="Search">
        </div>
        <button id="mobile-menu-btn" class="md:hidden my-auto pl-1.5 cursor-pointer">
            <img src="/img/open_menu.png" alt="Menu" class="w-8 h-8 brightness-0 invert">
        </button>
    </header>
    <main class="flex justify-center md:justify-between bg-gray-950 pt-24 min-h-screen">
        <div class="w-full md:w-2/3 mx-2 my-4">
            <div>
                <ul class="flex mx-3 p-2"id="choix">
                    <li data-type="all" class="active-filter text-white border border-[#928b8b26] bg-gray-500 rounded-lg px-3 p-1 m-2 cursor-pointer">Tous</li>
                    <li data-type="movie" class="text-white border border-[#928b8b26] bg-gray-500 rounded-lg px-3 p-1 m-2 cursor-pointer">Films</li>
                    <li data-type="series" class="text-white border border-[#928b8b26] bg-gray-500 rounded-lg px-3 p-1 m-2 cursor-pointer">Séries</li>
                </ul>
            </div>
            <div id="affichage" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <article class="flex flex-col border border-gray-600 rounded-3xl overflow-hidden bg-gray-900">
                    <img src="/img/breaking-bad-comic-art-jvmua77hy4u4vp8f.jpg" alt="Poster" class="w-full h-96 object-cover">
                    <div class="p-4 text-center flex-grow flex flex-col justify-center">
                        <h1 class="text-2xl font-bold mb-1">Breaking Bad</h1>
                        <div class="text-gray-400">2008 · series</div>
                    </div>
                    <button class="w-full p-3 bg-red-500 hover:bg-red-600 transition-colors font-bold cursor-pointer">Show details</button>
                </article>
            </div>
            <div class="my-4">
                <nav>
                    <ul id="pagination" class="flex justify-center gap-2">
                        <li class="text-gray-400 border border-gray-400 bg-red-300 rounded-lg px-3 p-1 m-1">Previous</li>
                        <li class="text-red-600 border border-red-600 bg-white rounded-lg px-3 p-1 m-1">1</li>
                        <li class="text-white border border-gray-400 bg-red-500 rounded-lg px-3 p-1 m-1">Next</li>
                    </ul>
                </nav>
            </div>
        </div>

        <div id="favorites-sidebar" class="fixed top-0 right-0 h-full w-72 bg-gray-800 z-[60] transform translate-x-full transition-transform duration-300 md:sticky md:top-24 md:h-[calc(100vh-6rem)] md:w-1/3 md:translate-x-0 shadow-2xl flex flex-col">
            
            <div class="flex justify-between items-center p-2 border-b border-gray-700">
                <p class="font-bold text-xl ml-2">Favorites</p>
                <button id="close-sidebar-btn" class="md:hidden p-2 cursor-pointer">
                    <img src="/img/arrow.png" alt="Fermer" class="w-6 h-6 brightness-0 invert">
                </button>
            </div>
            <div id="compteur" class="grid grid-cols-2">
                <p class="font-bold text-start p-3">Tous</p>
                <p id="All" class="all text-center text-red-500 font-bold p-3"></p>
                <p class="font-bold text-start p-3">Séries</p>
                <p id="series" class="series text-center text-red-500 font-bold p-3"></p>
                <p class="font-bold text-start p-3">Films</p>
                <p id="films" class="films text-center text-red-500 font-bold p-3"></p>
                
            </div>
            <div id="favorites-list" class="p-2 overflow-y-auto flex-grow">
            </div>
        </div>
    </main>
    <footer>
        <h1>Ichharat</h1>
    </footer>

    <div id="movie-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-[100] p-4 transition-opacity duration-300">
        <div class="bg-gray-800 text-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto relative flex flex-col md:flex-row">
            <button id="close-modal" class="absolute top-3 right-4 text-gray-400 hover:text-white text-3xl font-bold z-10">&times;</button>
            <div class="w-full md:w-2/5 flex-shrink-0">
                <img id="modal-image" src="" alt="Poster" class="w-full h-full object-cover rounded-t-2xl md:rounded-l-2xl md:rounded-tr-none max-h-[50vh] md:max-h-full">
            </div>
            <div class="p-6 flex flex-col gap-3 w-full md:w-3/5">
                <h2 id="modal-title" class="text-3xl font-bold text-red-500"></h2>
                <div class="text-gray-300 text-sm flex gap-2 font-semibold">
                    <span id="modal-type" class="bg-gray-700 px-2 py-1 rounded"></span>
                    <span id="modal-year" class="bg-gray-700 px-2 py-1 rounded"></span>
                    <span id="modal-duration" class="bg-gray-700 px-2 py-1 rounded"></span>
                </div>

                <div class="mt-2 text-sm">
                    <p><strong class="text-gray-400">Genres :</strong> <span id="modal-genres"></span></p>
                    <p class="mt-1"><strong class="text-gray-400">Réalisateurs :</strong> <span id="modal-directors"></span></p>
                    <p class="mt-1"><strong class="text-gray-400">Pays de production :</strong> <span id="modal-countries"></span></p>
                </div>

                <hr class="border-gray-600 my-2">

                <div>
                    <strong class="text-gray-400">Description :</strong>
                    <p id="modal-description" class="text-gray-200 mt-1 leading-relaxed text-sm"></p>
                </div>
                <a id="modal-watch-btn" title="It's only illegal if you get caught." href="#" target="_blank" class="mt-auto bg-red-500 hover:bg-red-600 hover:scale-105 text-white font-bold py-3 px-6 rounded-lg text-center transition-colors inline-block w-full md:w-auto self-start">
                    Watch now 😉
                </a>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
